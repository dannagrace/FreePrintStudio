name: Release Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-release:
    name: Verify release readiness
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run release gate
        run: Scripts/verify_release.sh
