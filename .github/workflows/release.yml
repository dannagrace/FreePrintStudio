name: Release Gates

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    name: Verify release readiness
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Static release checks
        timeout-minutes: 5
        run: Scripts/verify_release.sh static

      - name: Core checks
        timeout-minutes: 5
        run: Scripts/verify_release.sh core

      - name: Property list lint
        timeout-minutes: 2
        run: Scripts/verify_release.sh plist

      - name: PDF export validation
        timeout-minutes: 20
        env:
          FREEPRINTSTUDIO_MAX_SIMULATOR_CANDIDATES: 0
          FREEPRINTSTUDIO_TEMPORARY_SIMULATOR_BOOT_TIMEOUT_SECONDS: 300
          FREEPRINTSTUDIO_TEMPORARY_SIMULATOR_APP_LAUNCH_TIMEOUT_SECONDS: 360
        run: Scripts/verify_release.sh pdf

      - name: Release iOS build
        timeout-minutes: 10
        run: Scripts/verify_release.sh build

      - name: Review UI validation
        timeout-minutes: 10
        run: Scripts/verify_release.sh review-ui

      - name: Screenshot asset checks
        timeout-minutes: 5
        run: Scripts/verify_release.sh screenshots

      - name: Public pages validation
        timeout-minutes: 2
        run: Scripts/verify_release.sh public-pages

      - name: App Store submission packet
        timeout-minutes: 5
        run: Scripts/verify_release.sh submission-packet

      - name: Validate App Store submission packet
        timeout-minutes: 2
        run: Scripts/verify_release.sh submission-packet-check

      - name: Upload App Store submission packet
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: freeprintstudio-app-store-submission-packet
          path: build/AppStoreSubmissionPacket
          if-no-files-found: error
          retention-days: 30
