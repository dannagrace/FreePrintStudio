name: Release Gates

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-release:
    name: Verify release readiness
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Static release checks
        run: Scripts/verify_release.sh static

      - name: Core checks
        run: Scripts/verify_release.sh core

      - name: Property list lint
        run: Scripts/verify_release.sh plist

      - name: PDF export validation
        timeout-minutes: 15
        env:
          FREEPRINTSTUDIO_MAX_SIMULATOR_CANDIDATES: 0
        run: Scripts/verify_release.sh pdf

      - name: Release iOS build
        timeout-minutes: 10
        run: Scripts/verify_release.sh build

      - name: Screenshot asset checks
        run: Scripts/verify_release.sh screenshots
